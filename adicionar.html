<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Membro - CLJ Diocese de Frederico Westphalen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { slate: { 850: '#151e2e', 950: '#0a0f1a' } } } }
        }
    </script>
</head>
<body class="bg-slate-950 font-sans antialiased text-slate-200 relative min-h-screen">

    <div class="fixed inset-0 opacity-[0.15] pointer-events-none z-0"
         style="background-image: url('data:image/svg+xml,%3Csvg width=\'24\' height=\'24\' viewBox=\'0 0 24 24\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Ccircle cx=\'2\' cy=\'2\' r=\'1\' fill=\'%23ffffff\'/%3E%3C/svg%3E');"></div>
    <div class="fixed top-[-20%] left-[-10%] w-96 h-96 bg-slate-400/10 rounded-full blur-[120px] pointer-events-none z-0"></div>
    <div class="fixed bottom-[-20%] right-[-10%] w-[500px] h-[500px] bg-slate-300/5 rounded-full blur-[150px] pointer-events-none z-0"></div>

    <header class="relative z-20 bg-slate-900/60 backdrop-blur-md border-b border-slate-800 sticky top-0">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex items-center justify-between">
            <button onclick="window.location.href='hub.html'" class="text-sm font-medium text-slate-400 hover:text-white transition-colors flex items-center gap-2 p-2 rounded-lg hover:bg-slate-800">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span class="hidden sm:inline">Voltar ao Hub</span>
            </button>
            <img src="assets/logo diocese sem fundo.png" alt="Logo CLJ" class="h-10 w-auto object-contain">
        </div>
    </header>

    <!-- Toast -->
    <div x-data style="display:none;"
         x-show="$store.toast.visivel"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 translate-y-2"
         :class="$store.toast.tipo === 'ok' ? 'border-green-500/30 text-green-300' : 'border-red-500/30 text-red-300'"
         class="fixed bottom-6 right-4 sm:right-6 z-[200] px-4 py-3 rounded-xl shadow-2xl text-sm font-medium flex items-center gap-2.5 max-w-xs bg-slate-800 border">
        <svg x-show="$store.toast.tipo === 'ok'" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
        <svg x-show="$store.toast.tipo === 'erro'" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        <span x-text="$store.toast.msg"></span>
    </div>

    <main class="relative z-10 max-w-2xl mx-auto px-4 py-10 sm:py-12" x-data="addMemberForm()">

        <div class="bg-slate-900/60 backdrop-blur-xl rounded-3xl shadow-2xl border border-slate-700/50 p-8 sm:p-10">
            <h2 class="text-2xl font-bold text-slate-100 mb-2">Cadastrar Membro do PSP</h2>
            <p class="text-slate-400 text-sm mb-8">Preencha os dados para adicionar um novo contato ao diretório diocesano.</p>

            <form @submit.prevent="salvarMembro" class="space-y-6">

                <div>
                    <label for="nome" class="block text-sm font-medium text-slate-400 mb-2">Nome Completo</label>
                    <input type="text" id="nome" x-model="form.nome" required
                           class="w-full px-4 py-3 rounded-xl border border-slate-700/50 focus:ring-2 focus:ring-slate-400/30 focus:border-slate-400 outline-none transition-all text-slate-200 bg-slate-950/50 placeholder-slate-600 shadow-inner"
                           placeholder="Ex: João da Silva">
                </div>

                <div>
                    <label for="cidade" class="block text-sm font-medium text-slate-400 mb-2">Paróquia / Cidade</label>
                    <div class="relative">
                        <select id="cidade" x-model="form.cidade_id" required :disabled="!isAdmin"
                                :class="!isAdmin ? 'opacity-60 cursor-not-allowed' : 'cursor-pointer'"
                                class="w-full px-4 py-3 rounded-xl border border-slate-700/50 focus:ring-2 focus:ring-slate-400/30 focus:border-slate-400 outline-none transition-all text-slate-200 bg-slate-950/50 appearance-none shadow-inner">
                            <option value="" disabled selected>Selecione a paróquia...</option>
                            <template x-for="cidade in cidadesList" :key="cidade.id">
                                <option :value="cidade.id" x-text="`${cidade.nome} - ${cidade.paroquia}`"></option>
                            </template>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-500">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label for="cargo" class="block text-sm font-medium text-slate-400 mb-2">Função / Cargo</label>
                        <input type="text" id="cargo" x-model="form.cargo" required
                               class="w-full px-4 py-3 rounded-xl border border-slate-700/50 focus:ring-2 focus:ring-slate-400/30 focus:border-slate-400 outline-none transition-all text-slate-200 bg-slate-950/50 placeholder-slate-600 shadow-inner"
                               placeholder="Ex: Presidente">
                    </div>
                    <div>
                        <label for="telefone" class="block text-sm font-medium text-slate-400 mb-2">WhatsApp</label>
                        <input type="tel" id="telefone" x-model="form.telefone" required
                               class="w-full px-4 py-3 rounded-xl border border-slate-700/50 focus:ring-2 focus:ring-slate-400/30 focus:border-slate-400 outline-none transition-all text-slate-200 bg-slate-950/50 placeholder-slate-600 shadow-inner"
                               placeholder="Ex: 55 51 99999-9999">
                    </div>
                </div>

                <div class="pt-6 flex gap-4">
                    <button type="button" onclick="window.location.href='hub.html'"
                            class="flex-1 px-4 py-3.5 rounded-xl border border-slate-700 hover:bg-slate-800 text-slate-300 font-semibold transition-colors">
                        Cancelar
                    </button>
                    <button type="submit" :disabled="isLoading"
                            class="flex-1 relative bg-slate-200 hover:bg-white text-slate-900 font-bold py-3.5 px-4 rounded-xl transition-all flex justify-center items-center disabled:opacity-70 disabled:cursor-not-allowed group overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/40 to-transparent translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></div>
                        <span x-show="!isLoading" class="relative z-10">Salvar Contato</span>
                        <svg x-show="isLoading" style="display:none;" class="animate-spin h-5 w-5 text-slate-900 relative z-10" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </div>

            </form>
        </div>
    </main>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        import Alpine from 'https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/module.esm.js';
        import { supabaseUrl, supabaseKey } from './config.js';

        const supabase = createClient(supabaseUrl, supabaseKey);

        Alpine.store('toast', {
            visivel: false, msg: '', tipo: 'ok', _t: null,
            show(msg, tipo = 'ok') {
                this.msg = msg; this.tipo = tipo; this.visivel = true;
                clearTimeout(this._t);
                this._t = setTimeout(() => { this.visivel = false; }, 3500);
            }
        });

        Alpine.data('addMemberForm', () => ({
            cidadesList: [], isLoading: false, isAdmin: false,
            form: { nome: '', cidade_id: '', cargo: '', telefone: '' },
            _cidadeNome: '',

            async init() {
                if (!localStorage.getItem('clj_auth')) { window.location.href = 'login.html'; return; }
                const usuario = localStorage.getItem('clj_user') || '';
                this.isAdmin = usuario === 'diocesano';

                let query = supabase.from('cidades').select('id, nome, paroquia, sigla').order('nome');
                if (!this.isAdmin) query = query.eq('sigla', usuario);

                const { data } = await query;
                if (data) {
                    this.cidadesList = data;
                    if (!this.isAdmin && data.length > 0) {
                        this.form.cidade_id = data[0].id;
                        this._cidadeNome = data[0].nome;
                    }
                }
            },

            normalizarTelefone(raw) {
                const num = raw.replace(/\D/g, '');
                if (num.startsWith('55') && num.length >= 12) return num;
                if (num.length === 11) return '55' + num;
                if (num.length === 10) return '55' + num.slice(0, 2) + '9' + num.slice(2);
                return num;
            },

            async salvarMembro() {
                this.isLoading = true;
                try {
                    const { error } = await supabase.from('membros_psp').insert([{
                        nome: this.form.nome,
                        cidade_id: this.form.cidade_id,
                        cargo: this.form.cargo,
                        telefone: this.normalizarTelefone(this.form.telefone)
                    }]);
                    if (error) throw error;

                    await this.registrarHistorico(this.form.nome, this.form.cargo, this.form.cidade_id);

                    Alpine.store('toast').show('Membro cadastrado! Redirecionando...');
                    this.form = { nome: '', cidade_id: '', cargo: '', telefone: '' };
                    setTimeout(() => { window.location.href = 'hub.html'; }, 1800);
                } catch {
                    Alpine.store('toast').show('Erro ao cadastrar. Verifique a conexão.', 'erro');
                } finally {
                    this.isLoading = false;
                }
            },

            async registrarHistorico(membroNome, membroCargo, cidadeId) {
                try {
                    const cidade = this.cidadesList.find(c => c.id === cidadeId);
                    const usuario = localStorage.getItem('clj_user') || '';
                    await supabase.from('historico_alteracoes').insert({
                        usuario_sigla: usuario,
                        acao: 'adicionou',
                        membro_nome: membroNome,
                        membro_cargo: membroCargo || '',
                        paroquia_nome: cidade?.nome || ''
                    });
                } catch {}
            }
        }));

        window.Alpine = Alpine;
        Alpine.start();
    </script>
</body>
</html>
