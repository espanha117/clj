<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CLJ Diocese de Frederico Westphalen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151e2e',
                            950: '#0a0f1a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 font-sans antialiased text-slate-200 relative min-h-screen overflow-hidden flex items-center justify-center">

    <div class="absolute inset-0 opacity-[0.15] pointer-events-none" 
         style="background-image: url('data:image/svg+xml,%3Csvg width=\'24\' height=\'24\' viewBox=\'0 0 24 24\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Ccircle cx=\'2\' cy=\'2\' r=\'1\' fill=\'%23ffffff\'/%3E%3C/svg%3E');">
    </div>

    <div class="absolute top-[-20%] left-[-10%] w-96 h-96 bg-slate-400/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-96 h-96 bg-slate-300/5 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="relative z-10 w-full max-w-md p-4" x-data="loginForm()">
        
        <div class="bg-slate-900/60 backdrop-blur-xl rounded-3xl shadow-2xl border border-slate-700/50 overflow-hidden relative">
            
            <div class="pt-10 pb-6 px-8 flex flex-col items-center">
                <img 
                    src="assets/logo diocese sem fundo.png" 
                    alt="Logo CLJ" 
                    class="h-32 w-auto object-contain drop-shadow-[0_0_15px_rgba(255,255,255,0.15)] transition-transform duration-500 hover:scale-105"
                >
            </div>

            <div class="px-8 pb-10">
                <h2 class="text-lg font-medium text-center text-slate-300 mb-8 tracking-wide">
                    Acesso ao Sistema
                </h2>

                <div x-show="error" 
                     x-transition:enter="transition ease-out duration-300"
                     x-transition:enter-start="opacity-0 transform -translate-y-2"
                     x-transition:enter-end="opacity-100 transform translate-y-0"
                     class="mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm flex items-center" 
                     style="display: none;">
                    <svg class="w-5 h-5 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <span x-text="error"></span>
                </div>

                <form @submit.prevent="handleLogin" class="space-y-5">
                    
                    <div>
                        <label for="campo-usuario" class="block text-sm font-medium text-slate-400 mb-1.5 ml-1">Usuário</label>
                        <div class="relative">
                            <input
                                type="text"
                                id="campo-usuario"
                                x-model="email"
                                required
                                autocomplete="username"
                                class="w-full pl-4 pr-10 py-3 rounded-xl border border-slate-700/50 focus:ring-2 focus:ring-slate-400/30 focus:border-slate-400 outline-none transition-all text-slate-200 bg-slate-950/50 placeholder-slate-600 shadow-inner"
                                placeholder="ex: nsa"
                            >
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-500">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label for="campo-senha" class="block text-sm font-medium text-slate-400 mb-1.5 ml-1">Senha</label>
                        <div class="relative">
                            <input 
                                type="password"
                                id="campo-senha"
                                x-model="password"
                                required
                                autocomplete="current-password"
                                class="w-full pl-4 pr-10 py-3 rounded-xl border border-slate-700/50 focus:ring-2 focus:ring-slate-400/30 focus:border-slate-400 outline-none transition-all text-slate-200 bg-slate-950/50 placeholder-slate-600 shadow-inner"
                                placeholder="••••••••"
                            >
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-500">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            </div>
                        </div>
                    </div>

                    <button 
                        type="submit" 
                        :disabled="isLoading"
                        class="relative w-full mt-8 bg-slate-200 hover:bg-white text-slate-900 font-semibold py-3.5 px-4 rounded-xl transition-all duration-300 flex justify-center items-center disabled:opacity-70 disabled:cursor-not-allowed shadow-[0_0_20px_rgba(255,255,255,0.05)] hover:shadow-[0_0_30px_rgba(255,255,255,0.15)] group overflow-hidden"
                    >
                        <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/40 to-transparent translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></div>
                        
                        <span x-show="!isLoading" class="relative z-10 text-slate-900 font-bold">Acessar Painel</span>
                        
                        <svg x-show="isLoading" style="display: none;" class="animate-spin -ml-1 mr-3 h-5 w-5 text-slate-900 relative z-10" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span x-show="isLoading" style="display: none;" class="relative z-10 text-slate-900 font-bold">Autenticando...</span>
                    </button>
                </form>
            </div>
            
            <div class="bg-slate-900/80 px-6 py-4 border-t border-slate-700/50 text-center backdrop-blur-md">
                <p class="text-xs text-slate-500">
                    Secretariado Diocesano &bull; Uso Restrito
                </p>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        import Alpine from 'https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/module.esm.js';
        import { supabaseUrl, supabaseKey } from './config.js';

        const supabase = createClient(supabaseUrl, supabaseKey);

        Alpine.data('loginForm', () => ({
            email: '',
            password: '',
            isLoading: false,
            error: '',

            async handleLogin() {
                this.error = '';
                this.isLoading = true;

                try {
                    const { data: loginCorreto, error: supabaseError } = await supabase.rpc('validar_login', {
                        p_usuario: this.email,
                        p_senha: this.password
                    });

                    if (supabaseError) throw supabaseError;

                    if (loginCorreto) {
                        localStorage.setItem('clj_auth', 'true');
                        localStorage.setItem('clj_user', this.email);
                        window.location.href = 'hub.html';
                    } else {
                        this.error = 'Credenciais inválidas. Verifique seu usuário e senha.';
                    }
                } catch (err) {
                    console.error('Erro de conexão:', err);
                    this.error = 'Erro ao conectar com o banco de dados. Tente novamente.';
                } finally {
                    this.isLoading = false;
                }
            }
        }));

        // Inicializa o Alpine manualmente após registrar os dados
        window.Alpine = Alpine;
        Alpine.start();
    </script>
</body>
</html>
